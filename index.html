<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Weather — Sri Lanka Forecast</title>
<meta name="theme-color" content="#07111b">
<meta name="description" content="Explore Sri Lanka's weather through an interactive map, animated wind, hourly forecast and district rainfall intelligence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>

:root{color-scheme:dark;--bg:#07111b;--panel:rgba(11,25,39,.91);--panel2:#0d1d2b;--line:rgba(164,194,211,.15);--text:#f2f7fb;--muted:#8ca4b5;--teal:#55e6cf;--blue:#5ba7ff;--shadow:0 22px 65px rgba(0,0,0,.38)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Instrument Sans",Inter,system-ui,sans-serif}
body{overflow:hidden}
#map{position:absolute;inset:0;background:#0a1a27}
.leaflet-tile-pane{filter:invert(1) hue-rotate(190deg) brightness(.62) saturate(.5) contrast(1.05)}
#field,#wind{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#field{z-index:440;opacity:.65}#wind{z-index:450}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.side{position:absolute;z-index:900;top:18px;left:76px;width:350px;max-height:calc(100% - 112px);overflow:auto;padding:22px;scrollbar-width:thin;scrollbar-color:#345365 transparent}
.side:before{content:"WEATHER INTELLIGENCE  /  SRI LANKA";display:block;color:var(--teal);font-size:10px;letter-spacing:.18em;font-weight:700;margin-bottom:13px}
h1{margin:0;font-size:1.18rem;font-weight:650;letter-spacing:-.035em}
.side h1{font-size:1.8rem;letter-spacing:-.065em;line-height:1.05}
.side h1:before{content:none}
.side p{margin:9px 0 0;font-size:.82rem;color:var(--muted);line-height:1.55}
.srch{display:flex;gap:8px;margin-top:19px}
input[type=search]{flex:1;min-width:0;background:#081722;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font:inherit;font-size:.85rem}
input[type=search]:focus{outline:1px solid var(--teal);border-color:var(--teal)}
button,select{font:inherit;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
button:hover{border-color:rgba(85,230,207,.7)!important}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#loc{background:var(--teal);color:#06211e;border:1px solid var(--teal);border-radius:11px;padding:0 14px;font-size:.82rem;font-weight:700}
#res{font-size:.8rem;color:var(--muted);margin-top:5px;max-height:120px;overflow:auto}
#res button{display:block;width:100%;text-align:left;background:#102435;color:var(--text);border:1px solid transparent;border-radius:9px;padding:9px 10px;margin-top:4px;font-size:.83rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:19px 0 21px}
.stat{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid rgba(164,194,211,.1);border-radius:13px;padding:13px 12px}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--teal);opacity:.75}
.stat b{display:block;font-size:1.25rem;font-weight:650;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:5px;color:var(--muted);font-size:.7rem;line-height:1.4}
.layers{display:flex;flex-wrap:wrap;gap:7px}
.layers:before{content:"MAP OVERLAYS";width:100%;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.14em;margin:0 0 3px}
.layers button,.tabs button{background:#0a1b29;color:#9bb0bd;border:1px solid var(--line);padding:8px 11px;border-radius:9px;font-size:.77rem}
.layers button[aria-pressed=true],.tabs button[aria-pressed=true]{background:rgba(85,230,207,.12);color:var(--teal);border-color:rgba(85,230,207,.45);font-weight:650}
.units{display:flex;gap:7px;margin-top:17px;flex-wrap:wrap}
.units select,.units button{background:#0a1b29;color:#dce8ef;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:.76rem}
.units button{margin-left:auto}
select option{background:#0b1d2a}
.legend{margin-top:19px;padding-top:16px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
#legT{font-size:.78rem;color:#d6e4ed}
.ramp{height:7px;border-radius:20px;margin:10px 0 7px;border:0}
.lab{display:flex;justify-content:space-between;font-size:.68rem}
.bar{position:absolute;z-index:900;left:50%;transform:translateX(-50%);bottom:20px;display:flex;gap:13px;align-items:center;padding:12px 15px;width:min(760px,calc(100% - 40px));border-radius:16px}
#play{background:var(--teal);color:#06211e;border:1px solid var(--teal);border-radius:10px;padding:10px 17px;font-weight:700;min-width:78px}
input[type=range]{flex:1;accent-color:var(--teal);min-width:80px;cursor:pointer}
#when{min-width:145px;font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums;color:#d9e7ef}
.detail{position:absolute;z-index:900;top:18px;right:18px;width:360px;max-height:calc(100% - 112px);overflow:auto;padding:20px;display:none;scrollbar-width:thin;scrollbar-color:#345365 transparent}
.detail.on{display:block}
.dh{display:flex;justify-content:space-between;align-items:start;gap:8px}
.dh button{background:#102435;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:15px 0}
.tiles div{background:#0b1d2b;border:1px solid rgba(164,194,211,.1);border-radius:12px;padding:12px;min-width:0}
.tiles b{display:block;font-size:1.12rem;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tiles span{display:block;margin-top:4px;font-size:.71rem;color:var(--muted);line-height:1.4}
.detail h2{font-size:.8rem;margin:19px 0 7px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#d6e6ee}
.detail ul{margin:7px 0;padding-left:18px;font-size:.83rem;line-height:1.65;color:#c4d5df}
.detail li+li{margin-top:5px}
svg text{fill:var(--muted);font-size:9px;font-family:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1d2b;color:var(--text);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;font-family:inherit;font-size:.85rem;line-height:1.55}
.leaflet-control-zoom{border:1px solid var(--line)!important;border-radius:10px!important;overflow:hidden}
.leaflet-control-zoom a{background:#0b1d2b!important;color:var(--text)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(7,17,27,.72)!important;color:#9bb0bd!important}
.leaflet-control-attribution a{color:var(--teal)!important}
body.dist #detail{display:none!important}
.dm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;color:#fff;text-shadow:0 1px 2px #000;border:2px solid rgba(255,255,255,.85);box-shadow:0 5px 18px #0007}
.tabs{display:flex;gap:6px;margin:13px 0;flex-wrap:wrap}
.row{display:grid;grid-template-columns:108px 1fr 45px;gap:8px;align-items:center;padding:8px 0;cursor:pointer;font-size:.81rem;border-bottom:1px solid rgba(164,194,211,.08)}
.row i{display:block;height:7px;border-radius:5px;background:linear-gradient(90deg,#4d9cff,#8b7bfa)}
.row b{text-align:right;font-variant-numeric:tabular-nums}
.row small,.note{display:block;color:var(--muted);font-size:.69rem;line-height:1.45}
.row small.hi{color:#fb923c}
.note{margin-top:11px}
#msg{position:absolute;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);padding:15px 20px;border-radius:13px;color:var(--text);font-size:.88rem}
@media(max-width:900px){.side{left:62px;width:310px;padding:17px}.side h1{font-size:1.55rem}.detail{width:330px;right:12px}}
@media(max-width:700px){
 body{overflow:hidden}
 .side{top:9px;left:52px;right:9px;width:auto;max-height:calc(100% - 100px);padding:13px;border-radius:15px}
 .side:before{font-size:8px;margin-bottom:8px}.side h1{font-size:1.35rem}.side p{font-size:.72rem;margin-top:5px}
 .srch{margin-top:10px}input[type=search]{padding:10px}
 .stats{grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 13px}.stat{padding:8px 9px}.stat b{font-size:.96rem}.stat span{font-size:.65rem}
 .layers{gap:5px}.layers button{padding:6px 8px;font-size:.69rem}
 .units{margin-top:10px;gap:5px}.units select,.units button{padding:7px;font-size:.7rem}.units button{margin-left:0}
 .legend{margin-top:12px;padding-top:10px}
 .detail{top:auto;bottom:82px;left:9px;right:9px;width:auto;max-height:42vh;padding:14px;border-radius:15px}
 .bar{bottom:max(9px,env(safe-area-inset-bottom));width:calc(100% - 18px);gap:8px;padding:8px 9px;border-radius:13px}
 #play{padding:9px 11px;min-width:62px}#when{min-width:94px;font-size:.71rem}
 #res{max-height:80px}
}
@media(max-width:390px){.side{left:48px;right:7px;padding:10px}.side h1{font-size:1.2rem}.units select,.units button{font-size:.66rem;padding:6px}.layers button{font-size:.65rem;padding:5px 6px}.stats{gap:5px}.bar{gap:6px}#when{min-width:80px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<div id="map"></div><canvas id="field"></canvas><canvas id="wind"></canvas>
<section class="panel side">
  <h1>Island Weather</h1><p>Interactive forecast intelligence for Sri Lanka.<br>Explore atmospheric conditions, coastlines and district rainfall.</p>
  <div class="srch"><input id="q" type="search" placeholder="Search a town" aria-label="Search a town" autocomplete="off"><button type="button" id="loc" aria-label="Use my location" title="Use my location">Locate</button></div><div id="res"></div>
  <div class="stats" id="stats"></div>
  <div class="layers" id="layers" role="group" aria-label="Map layer"></div>
  <div class="units"><select id="uw" aria-label="Wind unit"><option value="kmh">km/h</option><option value="ms">m/s</option><option value="kn">knots</option></select><select id="ut" aria-label="Temperature unit"><option value="c">°C</option><option value="f">°F</option></select><button type="button" id="share">Share link</button></div>
  <div class="legend"><div id="legT"></div><div class="ramp" id="ramp"></div><div class="lab" id="legL"></div></div>
</section>
<aside class="panel detail" id="detail" aria-live="polite"></aside>
<aside class="panel detail" id="dist" aria-live="polite"></aside>
<div class="panel bar">
  <button id="play" type="button">Play</button>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="Forecast hour">
  <div id="when">Loading…</div>
</div>
<div class="panel" id="msg">Loading forecast…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var LAT0=4.5,LAT1=11.0,LON0=78.0,LON1=83.5,STEP=0.5;
  var nLat=Math.round((LAT1-LAT0)/STEP)+1,nLon=Math.round((LON1-LON0)/STEP)+1,lats=[],lons=[];
  for(var i=0;i<nLat;i++)for(var j=0;j<nLon;j++){lats.push((LAT0+i*STEP).toFixed(2));lons.push((LON0+j*STEP).toFixed(2));}

  var map=L.map('map',{minZoom:6,maxZoom:10,maxBounds:[[3,76],[12.5,85]]});
  var HS=parseHash();
  if(HS.c&&HS.c.length===2&&!isNaN(HS.c[0])&&!isNaN(HS.c[1])&&+HS.z)map.setView(HS.c,+HS.z);else map.fitBounds([[5.7,79.4],[9.9,82.1]],{padding:[60,60]});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

  var $=function(id){return document.getElementById(id)};
  var UW={kmh:{l:'km/h',f:1},ms:{l:'m/s',f:1/3.6},kn:{l:'kn',f:0.539957}},uw='kmh',ut='c';
  function Wf(k){return k*UW[uw].f}
  function Tm(c){return ut==='f'?c*9/5+32:c}
  function TU(){return ut==='f'?'°F':'°C'}
  var canvas=$('wind'),ctx=canvas.getContext('2d'),fc=$('field'),fx=fc.getContext('2d'),CELL=6;
  var slider=$('slider'),when=$('when'),playBtn=$('play'),detail=$('detail');
  var times=[],D={u:[],v:[],t:[],r:[],p:[],w:[],wp:[],sw:[],st:[]},hour=0,ready=false,playing=false,timer=null,layer=/^(wind|temp|rain|pres|dist|wave|sst)$/.test(HS.layer)?HS.layer:'wind',sel=null,marker=null;

  function size(){canvas.width=innerWidth;canvas.height=innerHeight;fc.width=Math.ceil(innerWidth/CELL);fc.height=Math.ceil(innerHeight/CELL);ctx.clearRect(0,0,canvas.width,canvas.height);drawField();}

  // colour scales: [value,[r,g,b,a]]
  var SPEED=[[0,[59,130,246]],[10,[34,211,238]],[20,[74,222,128]],[30,[250,204,21]],[40,[251,146,60]],[50,[239,68,68]]];
  var FIELDS={
    temp:{k:'t',name:'Temperature (°C)',labels:['22','27','32','37+'],stops:[[22,[59,130,246,210]],[25,[34,211,238,210]],[28,[74,222,128,210]],[31,[250,204,21,215]],[34,[251,146,60,225]],[37,[239,68,68,235]]]},
    rain:{k:'r',name:'Rain (mm per hour)',labels:['0','1','3','15+'],stops:[[0,[0,0,0,0]],[0.1,[147,197,253,120]],[1,[59,130,246,190]],[3,[139,92,246,215]],[8,[217,70,239,230]],[15,[244,63,94,240]]]},
    wave:{k:'w',sea:1,name:'Wave height (m)',labels:['0','1.3','2.7','4+'],stops:[[0,[96,165,250,70]],[0.5,[56,189,248,170]],[1,[34,211,238,200]],[1.5,[74,222,128,210]],[2.25,[250,204,21,220]],[3,[251,146,60,230]],[4,[239,68,68,240]]]},
    sst:{k:'st',sea:1,name:'Sea temperature',labels:['26','28','30','32'],stops:[[26,[59,130,246,210]],[27.5,[34,211,238,210]],[29,[250,204,21,215]],[30,[251,146,60,225]],[31.5,[239,68,68,235]]]},
    pres:{k:'p',name:'Sea-level pressure (hPa)',labels:['1002','1008','1014','1018+'],stops:[[1002,[139,92,246,210]],[1006,[59,130,246,210]],[1010,[74,222,128,210]],[1014,[250,204,21,210]],[1018,[251,146,60,220]]]}
  };
  function ramp(st,v){
    if(v<=st[0][0])return st[0][1];
    for(var i=0;i<st.length-1;i++)if(v<st[i+1][0]){var f=(v-st[i][0])/(st[i+1][0]-st[i][0]),a=st[i][1],b=st[i+1][1],o=[];for(var c=0;c<4;c++)o.push((a[c]==null?255:a[c])+((b[c]==null?255:b[c])-(a[c]==null?255:a[c]))*f);return o;}
    return st[st.length-1][1];
  }
  function windColor(ms){var c=ramp(SPEED,ms*3.6);return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}

  // layer buttons + legend
  [['wind','Wind'],['temp','Temperature'],['rain','Rain'],['pres','Pressure'],['wave','Waves'],['sst','Sea temp'],['dist','Districts']].forEach(function(l){
    var b=document.createElement('button');b.type='button';b.textContent=l[1];b.setAttribute('aria-pressed',l[0]===layer);
    b.onclick=function(){layer=l[0];[].forEach.call($('layers').children,function(x){x.setAttribute('aria-pressed',x===b)});legend();drawField();ctx.clearRect(0,0,canvas.width,canvas.height);setDist();stats();saveHash();};
    $('layers').appendChild(b);
  });
  function legend(){
    var st=layer==='wind'?SPEED:layer==='dist'?DIST:FIELDS[layer].stops,lo=st[0][0],hi=st[st.length-1][0];
    $('legT').textContent=layer==='wind'?'Wind speed ('+UW[uw].l+')':layer==='temp'?'Temperature ('+TU()+')':layer==='sst'?'Sea temperature ('+TU()+')':layer==='dist'?'District rain, '+WIN[dWin].t+' (mm)':FIELDS[layer].name;
    if(FIELDS[layer]&&FIELDS[layer].sea&&!D.w.length)$('legT').textContent+=' – loading…';
    $('ramp').style.background='linear-gradient(90deg,'+st.map(function(s){var c=s[1];return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(c[3]==null?1:Math.max(c[3]/255,.35))+') '+((s[0]-lo)/(hi-lo)*100)+'%'}).join(',')+')';
    $('legL').innerHTML=(layer==='wind'?[0,15,30,45].map(function(x,i){return Math.round(Wf(x))+(i==3?'+':'')}):layer==='temp'?[22,27,32,37].map(function(x,i){return Math.round(Tm(x))+(i==3?'+':'')}):layer==='sst'?[26,27.8,29.7,31.5].map(function(x,i){return Math.round(Tm(x))+(i==3?'+':'')}):layer==='dist'?[0,33,67,100].map(function(x,i){return Math.round(x*WIN[dWin].m)+(i==3?'+':'')}):FIELDS[layer].labels).map(function(x){return '<span>'+x+'</span>'}).join('');
  }

  // grid sampling
  function wts(lat,lon){
    if(lat<LAT0||lat>LAT1||lon<LON0||lon>LON1)return null;
    var fi=(lat-LAT0)/STEP,fj=(lon-LON0)/STEP,i=Math.min(Math.floor(fi),nLat-2),j=Math.min(Math.floor(fj),nLon-2);
    return [i*nLon+j,fi-i,fj-j];
  }
  function sval(a,w){
    var p=w[0],x=w[1],y=w[2],c=[a[p],a[p+1],a[p+nLon],a[p+nLon+1]],k=[(1-x)*(1-y),(1-x)*y,x*(1-y),x*y],t=0,f=0;
    for(var i=0;i<4;i++)if(c[i]===c[i]){t+=c[i]*k[i];f+=k[i];}
    return f<0.5?NaN:t/f;
  }
  function val(a,w){var p=w[0],x=w[1],y=w[2];return a[p]*(1-x)*(1-y)+a[p+1]*(1-x)*y+a[p+nLon]*x*(1-y)+a[p+nLon+1]*x*y;}

  var url='https://api.open-meteo.com/v1/forecast?latitude='+lats.join(',')+'&longitude='+lons.join(',')+
    '&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,precipitation,pressure_msl&wind_speed_unit=ms&forecast_days=3&timezone=Asia%2FColombo';
  fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(data){
    var arr=Array.isArray(data)?data:[data];times=arr[0].hourly.time;
    for(var t=0;t<times.length;t++){
      var u=new Float32Array(arr.length),v=u.slice(),tp=u.slice(),rn=u.slice(),ps=u.slice();
      for(var k=0;k<arr.length;k++){
        var h=arr[k].hourly,s=h.wind_speed_10m[t],d=h.wind_direction_10m[t]*Math.PI/180;
        u[k]=-s*Math.sin(d);v[k]=-s*Math.cos(d);tp[k]=h.temperature_2m[t];rn[k]=h.precipitation[t];ps[k]=h.pressure_msl[t];
      }
      D.u.push(u);D.v.push(v);D.t.push(tp);D.r.push(rn);D.p.push(ps);
    }
    var nowLocal=Date.now()+(arr[0].utc_offset_seconds||0)*1000;
    for(var q=0;q<times.length;q++)if(Date.parse(times[q]+'Z')<=nowLocal)hour=q;
    if(HS.t&&times.indexOf(HS.t)>=0)hour=times.indexOf(HS.t);slider.max=times.length-1;slider.value=hour;ready=true;$('msg').remove();update();requestAnimationFrame(frame);
    if(layer==='dist')setDist();
    if(HS.p){var pp=HS.p.split(',').map(Number);if(pp.length===2)selectPoint(L.latLng(pp[0],pp[1]),'');}
  }).catch(function(e){$('msg').textContent='Could not load the forecast ('+e.message+'). Check your connection and reload.';});

  function dayLabel(t){return new Date(times[t]).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'});}
  function update(){when.textContent=dayLabel(hour);drawField();stats();if(sel)renderDetail();saveHash();}

  function stats(){
    if(!ready)return;
    if((layer==='wave'||layer==='sst')&&D.w.length){
      var mw2=0,pS=0,pN=0,hi=-99,lo2=99,a=D.w[hour],b=D.wp[hour],c=D.st[hour];
      for(var q=0;q<a.length;q++){if(a[q]===a[q])mw2=Math.max(mw2,a[q]);if(b[q]===b[q]){pS+=b[q];pN++;}if(c[q]===c[q]){hi=Math.max(hi,c[q]);lo2=Math.min(lo2,c[q]);}}
      $('stats').innerHTML=[[mw2.toFixed(1)+' m','Highest waves'],[pN?(pS/pN).toFixed(0)+' s':'–','Average wave period'],[hi>-99?Tm(hi).toFixed(1)+' '+TU():'–','Warmest sea'],[lo2<99?Tm(lo2).toFixed(1)+' '+TU():'–','Coolest sea']]
        .map(function(x){return '<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('');
      return;
    }
    var n=D.u[hour].length,mw=0,at=0,mr=0,ap=0;

    navigator.geolocation.getCurrentPosition(function(p){var ll=L.latLng(p.coords.latitude,p.coords.longitude);if(selectPoint(ll,'Your location'))map.flyTo(ll,9);else res.textContent='Your location is outside the forecast area.';},function(){res.textContent='Location permission was denied.';});
  };
  function refreshUnits(){legend();if(ready){stats();if(sel)renderDetail();}}
  $('uw').onchange=function(){uw=this.value;refreshUnits();};
  $('ut').onchange=function(){ut=this.value;refreshUnits();};
  function parseHash(){
    var o={};location.hash.slice(1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])o[a[0]]=decodeURIComponent(a[1]||'');});
    if(o.c)o.c=o.c.split(',').map(Number);return o;
  }
  function saveHash(){
    if(!ready)return;var c=map.getCenter(),q=['layer='+layer,'t='+times[hour]];
    if(sel)q.push('p='+sel.lat.toFixed(3)+','+sel.lng.toFixed(3));
    q.push('c='+c.lat.toFixed(2)+','+c.lng.toFixed(2),'z='+map.getZoom());
    try{history.replaceState(null,'','#'+q.join('&'));}catch(e){}
  }
  function shareLink(btn){
    saveHash();var u=location.href,o=btn.textContent;
    function done(){btn.textContent='Copied';setTimeout(function(){btn.textContent=o;},1500);}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,function(){prompt('Copy this link',u);});else prompt('Copy this link',u);
  }
  $('share').onclick=function(){shareLink(this);};
  map.on('moveend',saveHash);
})();
</script>
</body>
</html>
