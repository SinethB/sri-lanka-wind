<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Weather — Sri Lanka Forecast</title>
<meta name="theme-color" content="#060e16">
<meta name="description" content="Explore Sri Lanka's weather through an interactive map, animated wind, hourly forecast and district rainfall intelligence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  color-scheme:dark;
  --bg:#060e16;
  --panel:rgba(10,22,34,.88);
  --panel-solid:#0c1926;
  --panel2:#0e1f2e;
  --line:rgba(148,180,200,.12);
  --line-strong:rgba(148,180,200,.22);
  --text:#eef5fa;
  --muted:#7d97ab;
  --muted2:#5c7588;
  --teal:#3dd9c0;
  --teal-dim:rgba(61,217,192,.14);
  --teal-glow:rgba(61,217,192,.35);
  --blue:#5b9dff;
  --amber:#f5b942;
  --rose:#f472b6;
  --violet:#a78bfa;
  --shadow:0 24px 64px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03) inset;
  --radius:16px;
  --radius-sm:10px;
  --font:"Inter",system-ui,-apple-system,sans-serif;
  --display:"Instrument Sans",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
#map{position:absolute;inset:0;background:#071420}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.58) saturate(.45) contrast(1.08)}
#field,#wind{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#field{z-index:440;opacity:.7}
#wind{z-index:450}

/* ── Panels ── */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(28px) saturate(1.2);
  -webkit-backdrop-filter:blur(28px) saturate(1.2);
}
.side{
  position:absolute;z-index:900;top:16px;left:72px;
  width:352px;max-height:calc(100% - 108px);overflow:auto;
  padding:20px 20px 18px;
  scrollbar-width:thin;scrollbar-color:#2a4558 transparent;
}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:#2a4558;border-radius:4px}

.brand{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--teal),#2bb8a8);
  display:grid;place-items:center;
  box-shadow:0 4px 14px var(--teal-glow);
  flex-shrink:0;
}
.brand-mark svg{width:18px;height:18px}
.brand-label{font-size:10px;letter-spacing:.2em;font-weight:700;color:var(--teal);text-transform:uppercase}
.brand-sub{font-size:11px;color:var(--muted2);margin-top:1px;letter-spacing:.02em}

.side h1{
  font-family:var(--display);font-size:1.72rem;font-weight:700;
  letter-spacing:-.04em;line-height:1.1;margin:0 0 6px;
}
.side .lead{font-size:.8rem;color:var(--muted);line-height:1.5;margin-bottom:16px}

/* Search */
.srch{display:flex;gap:7px;margin-bottom:4px}
input[type=search]{
  flex:1;min-width:0;background:rgba(6,16,24,.7);color:var(--text);
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 12px;font:inherit;font-size:.84rem;
  transition:border-color .2s,box-shadow .2s;
}
input[type=search]::placeholder{color:var(--muted2)}
input[type=search]:focus{
  outline:none;border-color:rgba(61,217,192,.5);
  box-shadow:0 0 0 3px rgba(61,217,192,.12);
}
button,select{font:inherit;cursor:pointer;transition:all .18s ease}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;
}
#loc{
  background:linear-gradient(135deg,var(--teal),#2ec4b0);
  color:#041a17;border:none;border-radius:var(--radius-sm);
  padding:0 14px;font-size:.8rem;font-weight:700;
  box-shadow:0 2px 10px var(--teal-glow);
}
#loc:hover{filter:brightness(1.08)}
#res{font-size:.78rem;color:var(--muted);margin-top:4px;max-height:110px;overflow:auto}
#res button{
  display:block;width:100%;text-align:left;
  background:rgba(16,36,52,.8);color:var(--text);
  border:1px solid transparent;border-radius:8px;
  padding:8px 10px;margin-top:3px;font-size:.82rem;
  transition:background .15s,border-color .15s;
}
#res button:hover{background:rgba(61,217,192,.1);border-color:rgba(61,217,192,.25)}

/* Stats grid */
.stats{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin:16px 0 18px;
}
.stat{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid rgba(148,180,200,.1);
  border-radius:12px;padding:12px 12px 11px;
  transition:border-color .2s,transform .2s;
}
.stat:hover{border-color:rgba(61,217,192,.25);transform:translateY(-1px)}
.stat-icon{
  width:22px;height:22px;border-radius:6px;
  display:grid;place-items:center;margin-bottom:8px;
  font-size:11px;
}
.stat-icon svg{width:13px;height:13px}
.stat b{
  display:block;font-size:1.22rem;font-weight:700;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  line-height:1.15;
}
.stat span{
  display:block;margin-top:3px;color:var(--muted);
  font-size:.68rem;line-height:1.35;font-weight:500;
}

/* Layer buttons */
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.sec-label{
  width:100%;color:var(--muted2);font-size:9.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;
}
.layers button,.tabs button{
  background:rgba(10,26,40,.9);color:var(--muted);
  border:1px solid var(--line);padding:7px 11px;border-radius:8px;
  font-size:.74rem;font-weight:500;
  transition:all .18s;
}
.layers button:hover,.tabs button:hover{
  border-color:rgba(61,217,192,.35);color:#c5dce8;
}
.layers button[aria-pressed=true],.tabs button[aria-pressed=true]{
  background:var(--teal-dim);color:var(--teal);
  border-color:rgba(61,217,192,.4);font-weight:600;
  box-shadow:0 0 12px rgba(61,217,192,.08);
}

/* Units & share */
.units{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;align-items:center}
.units select,.units button{
  background:rgba(10,26,40,.9);color:#d0e0eb;
  border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:.74rem;font-weight:500;
}
.units select:hover,.units button:hover{border-color:rgba(61,217,192,.3)}
.units button{margin-left:auto}
select option{background:#0b1d2a}

/* Legend */
.legend{
  margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line);font-size:.74rem;color:var(--muted);
}
#legT{font-size:.76rem;color:#c8d9e6;font-weight:500}
.ramp{
  height:6px;border-radius:20px;margin:9px 0 6px;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.lab{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted2)}

/* Bottom bar */
.bar{
  position:absolute;z-index:900;left:50%;transform:translateX(-50%);
  bottom:16px;display:flex;gap:12px;align-items:center;
  padding:10px 14px;width:min(720px,calc(100% - 32px));
  border-radius:14px;
}
#play{
  background:linear-gradient(135deg,var(--teal),#2ec4b0);
  color:#041a17;border:none;border-radius:9px;
  padding:9px 16px;font-weight:700;min-width:76px;font-size:.82rem;
  box-shadow:0 2px 10px var(--teal-glow);
}
#play:hover{filter:brightness(1.08)}
input[type=range]{
  flex:1;accent-color:var(--teal);min-width:70px;cursor:pointer;height:4px;
}
#when{
  min-width:140px;font-size:.78rem;text-align:right;
  font-variant-numeric:tabular-nums;color:#c8d9e6;font-weight:500;
}

/* Detail panel */
.detail{
  position:absolute;z-index:900;top:16px;right:16px;
  width:368px;max-height:calc(100% - 108px);overflow:auto;
  padding:18px;display:none;
  scrollbar-width:thin;scrollbar-color:#2a4558 transparent;
}
.detail.on{display:block;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.dh h1{font-family:var(--display);font-size:1.2rem;font-weight:700;letter-spacing:-.03em}
.dh .coords{font-size:.76rem;color:var(--muted);margin-top:2px}
.dh button{
  background:rgba(16,36,52,.9);color:var(--muted);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.78rem;
}
.dh button:hover{border-color:rgba(61,217,192,.35);color:#c5dce8}
.tiles{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0;
}
.tiles div{
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid rgba(148,180,200,.09);
  border-radius:11px;padding:11px 11px 10px;min-width:0;
}
.tiles b{
  display:block;font-size:1.1rem;font-weight:700;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums;
}
.tiles span{display:block;margin-top:3px;font-size:.68rem;color:var(--muted);line-height:1.35}
.detail h2{
  font-size:.72rem;margin:16px 0 6px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);
}
.detail ul{margin:6px 0;padding-left:16px;font-size:.8rem;line-height:1.6;color:#b0c5d4}
.detail li+li{margin-top:4px}
.note{display:block;color:var(--muted2);font-size:.68rem;line-height:1.4;margin-top:8px}
svg text{fill:var(--muted2);font-size:9px;font-family:var(--font)}

/* Leaflet overrides */
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  background:var(--panel-solid);color:var(--text);border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.leaflet-popup-content{margin:11px 13px;font-family:var(--font);font-size:.83rem;line-height:1.5}
.leaflet-control-zoom{border:1px solid var(--line)!important;border-radius:10px!important;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.3)!important}
.leaflet-control-zoom a{background:var(--panel-solid)!important;color:var(--text)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(6,14,22,.75)!important;color:var(--muted2)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--teal)!important}

body.dist #detail{display:none!important}
.dm{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-size:.76rem;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.8);
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.tabs{display:flex;gap:5px;margin:12px 0 10px;flex-wrap:wrap}
.row{
  display:grid;grid-template-columns:108px 1fr 42px;gap:8px;align-items:center;
  padding:7px 0;cursor:pointer;font-size:.8rem;
  border-bottom:1px solid rgba(148,180,200,.06);
  transition:background .15s;
}
.row:hover{background:rgba(61,217,192,.04)}
.row i{display:block;height:6px;border-radius:4px;background:linear-gradient(90deg,#4d9cff,#8b7bfa)}
.row b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row small{display:block;color:var(--muted2);font-size:.66rem;line-height:1.35}
.row small.hi{color:#fb923c}

#msg{
  position:absolute;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);
  padding:16px 24px;border-radius:14px;color:var(--text);font-size:.88rem;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
}

/* Chart container polish */
.chart-wrap{
  background:rgba(8,20,30,.5);border-radius:10px;padding:6px 4px 2px;
  border:1px solid rgba(148,180,200,.06);margin-bottom:2px;
}

@media(max-width:900px){
  .side{left:58px;width:310px;padding:16px}
  .side h1{font-size:1.5rem}
  .detail{width:330px;right:12px}
}
@media(max-width:700px){
  body{overflow:hidden}
  .side{
    top:8px;left:48px;right:8px;width:auto;
    max-height:calc(100% - 96px);padding:12px;border-radius:14px;
  }
  .side h1{font-size:1.3rem}
  .lead{font-size:.72rem}
  .stats{gap:6px;margin:10px 0 12px}
  .stat{padding:9px}
  .stat b{font-size:1rem}
  .layers button{padding:6px 8px;font-size:.68rem}
  .detail{
    top:auto;bottom:78px;left:8px;right:8px;width:auto;
    max-height:40vh;padding:13px;border-radius:14px;
  }
  .bar{bottom:max(8px,env(safe-area-inset-bottom));width:calc(100% - 16px);gap:8px;padding:8px 10px}
  #play{padding:8px 12px;min-width:60px}
  #when{min-width:90px;font-size:.7rem}
}
@media(max-width:390px){
  .side{left:44px;right:6px;padding:10px}
  .side h1{font-size:1.15rem}
  .layers button{font-size:.64rem;padding:5px 6px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="field"></canvas>
<canvas id="wind"></canvas>

<section class="panel side">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#041a17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-1.5 4-4 6.5-7 8 3 1.5 5.5 4 7 8 1.5-4 4-6.5 7-8-3-1.5-5.5-4-7-8z"/></svg>
    </div>
    <div>
      <div class="brand-label">Island Weather</div>
      <div class="brand-sub">Sri Lanka · Live Forecast</div>
    </div>
  </div>
  <h1>Weather Intelligence</h1>
  <p class="lead">Atmospheric conditions, coastlines and district rainfall — powered by Open-Meteo.</p>

  <div class="srch">
    <input id="q" type="search" placeholder="Search a town…" aria-label="Search a town" autocomplete="off">
    <button type="button" id="loc" aria-label="Use my location" title="Use my location">Locate</button>
  </div>
  <div id="res"></div>

  <div class="stats" id="stats"></div>

  <div class="layers" id="layers" role="group" aria-label="Map layer">
    <div class="sec-label">Map overlays</div>
  </div>

  <div class="units">
    <select id="uw" aria-label="Wind unit"><option value="kmh">km/h</option><option value="ms">m/s</option><option value="kn">knots</option></select>
    <select id="ut" aria-label="Temperature unit"><option value="c">°C</option><option value="f">°F</option></select>
    <button type="button" id="share">Share link</button>
  </div>

  <div class="legend">
    <div id="legT"></div>
    <div class="ramp" id="ramp"></div>
    <div class="lab" id="legL"></div>
  </div>
</section>

<aside class="panel detail" id="detail" aria-live="polite"></aside>
<aside class="panel detail" id="dist" aria-live="polite"></aside>

<div class="panel bar">
  <button id="play" type="button">Play</button>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="Forecast hour">
  <div id="when">Loading…</div>
</div>

<div class="panel" id="msg">Loading forecast…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var LAT0=4.5,LAT1=11.0,LON0=78.0,LON1=83.5,STEP=0.5;
  var nLat=Math.round((LAT1-LAT0)/STEP)+1,nLon=Math.round((LON1-LON0)/STEP)+1,lats=[],lons=[];
  for(var i=0;i<nLat;i++)for(var j=0;j<nLon;j++){lats.push((LAT0+i*STEP).toFixed(2));lons.push((LON0+j*STEP).toFixed(2));}

  var map=L.map('map',{minZoom:6,maxZoom:10,maxBounds:[[3,76],[12.5,85]],zoomControl:true});
  var HS=parseHash();
  if(HS.c&&HS.c.length===2&&!isNaN(HS.c[0])&&!isNaN(HS.c[1])&&+HS.z)map.setView(HS.c,+HS.z);
  else map.fitBounds([[5.7,79.4],[9.9,82.1]],{padding:[60,60]});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

  var $=function(id){return document.getElementById(id)};
  var UW={kmh:{l:'km/h',f:1},ms:{l:'m/s',f:1/3.6},kn:{l:'kn',f:0.539957}},uw='kmh',ut='c';
  function Wf(k){return k*UW[uw].f}
  function Tm(c){return ut==='f'?c*9/5+32:c}
  function TU(){return ut==='f'?'°F':'°C'}
  var canvas=$('wind'),ctx=canvas.getContext('2d'),fc=$('field'),fx=fc.getContext('2d'),CELL=6;
  var slider=$('slider'),when=$('when'),playBtn=$('play'),detail=$('detail');
  var times=[],D={u:[],v:[],t:[],r:[],p:[],w:[],wp:[],sw:[],st:[]},hour=0,ready=false,playing=false,timer=null,
      layer=/^(wind|temp|rain|pres|dist|wave|sst)$/.test(HS.layer)?HS.layer:'wind',sel=null,marker=null;

  function size(){
    canvas.width=innerWidth;canvas.height=innerHeight;
    fc.width=Math.ceil(innerWidth/CELL);fc.height=Math.ceil(innerHeight/CELL);
    ctx.clearRect(0,0,canvas.width,canvas.height);drawField();
  }

  var SPEED=[[0,[59,130,246]],[10,[34,211,238]],[20,[74,222,128]],[30,[250,204,21]],[40,[251,146,60]],[50,[239,68,68]]];
  var FIELDS={
    temp:{k:'t',name:'Temperature (°C)',labels:['22','27','32','37+'],stops:[[22,[59,130,246,210]],[25,[34,211,238,210]],[28,[74,222,128,210]],[31,[250,204,21,215]],[34,[251,146,60,225]],[37,[239,68,68,235]]]},
    rain:{k:'r',name:'Rain (mm per hour)',labels:['0','1','3','15+'],stops:[[0,[0,0,0,0]],[0.1,[147,197,253,120]],[1,[59,130,246,190]],[3,[139,92,246,215]],[8,[217,70,239,230]],[15,[244,63,94,240]]]},
    wave:{k:'w',sea:1,name:'Wave height (m)',labels:['0','1.3','2.7','4+'],stops:[[0,[96,165,250,70]],[0.5,[56,189,248,170]],[1,[34,211,238,200]],[1.5,[74,222,128,210]],[2.25,[250,204,21,220]],[3,[251,146,60,230]],[4,[239,68,68,240]]]},
    sst:{k:'st',sea:1,name:'Sea temperature',labels:['26','28','30','32'],stops:[[26,[59,130,246,210]],[27.5,[34,211,238,210]],[29,[250,204,21,215]],[30,[251,146,60,225]],[31.5,[239,68,68,235]]]},
    pres:{k:'p',name:'Sea-level pressure (hPa)',labels:['1002','1008','1014','1018+'],stops:[[1002,[139,92,246,210]],[1006,[59,130,246,210]],[1010,[74,222,128,210]],[1014,[250,204,21,210]],[1018,[251,146,60,220]]]}
  };
  function ramp(st,v){
    if(v<=st[0][0])return st[0][1];
    for(var i=0;i<st.length-1;i++)if(v<st[i+1][0]){
      var f=(v-st[i][0])/(st[i+1][0]-st[i][0]),a=st[i][1],b=st[i+1][1],o=[];
      for(var c=0;c<4;c++)o.push((a[c]==null?255:a[c])+((b[c]==null?255:b[c])-(a[c]==null?255:a[c]))*f);
      return o;
    }
    return st[st.length-1][1];
  }
  function windColor(ms){var c=ramp(SPEED,ms*3.6);return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}

  /* Layer buttons */
  var layerIcons={
    wind:'<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5h9a2 2 0 100-4H9M2 9h11a2.5 2.5 0 110 5H12M2 13h5"/></svg>',

  }
  function keyOf(ll){return ll.lat.toFixed(2)+','+ll.lng.toFixed(2);}
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
  function uvc(u){return u>=11?'extreme':u>=8?'very high':u>=6?'high':u>=3?'moderate':'low';}

  map.on('click',function(e){if(layer==='dist'||!ready)return;selectPoint(e.latlng,'');});
  function selectPoint(ll,name){
    if(!ready||!wts(ll.lat,ll.lng))return false;
    if(layer==='dist')$('layers').querySelector('button').click();
    sel=ll;place=name||'';
    if(!marker)marker=L.circleMarker(sel,{radius:7,color:'#fff',weight:2.5,fillColor:'#3dd9c0',fillOpacity:1}).addTo(map);
    marker.setLatLng(sel);
    var key=keyOf(sel);
    if(!(key in ptCache)){
      ptCache[key]='wait';
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+ll.lat.toFixed(3)+'&longitude='+ll.lng.toFixed(3)+'&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,pressure_msl,wind_speed_10m,wind_direction_10m,uv_index,cloud_cover,cape&daily=sunrise,sunset&wind_speed_unit=ms&forecast_days=3&timezone=Asia%2FColombo')
        .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
        .then(function(d){ptCache[key]=(d.hourly&&d.hourly.time.length===times.length&&d.hourly.time[0]===times[0])?d:null;if(sel&&keyOf(sel)===key)renderDetail();})
        .catch(function(){ptCache[key]=null;if(sel&&keyOf(sel)===key)renderDetail();});
    }
    if(!(key in mCache)){
      mCache[key]='wait';
      fetch('https://marine-api.open-meteo.com/v1/marine?latitude='+ll.lat.toFixed(3)+'&longitude='+ll.lng.toFixed(3)+'&hourly=wave_height,wave_period,swell_wave_height,sea_surface_temperature&forecast_days=3&timezone=Asia%2FColombo')
        .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
        .then(function(d){var h=d.hourly;mCache[key]=(h&&h.wave_height&&h.wave_height.some(function(x){return x!=null;}))?d:null;if(sel&&keyOf(sel)===key)renderDetail();})
        .catch(function(){mCache[key]=null;});
    }
    renderDetail();saveHash();return true;
  }

  function chart(v,o){
    var W=320,H=100,pl=32,pr=8,pt=10,pb=18,n=v.length,
        lo=o.lo!=null?o.lo:Math.min.apply(null,v),hi=o.hi!=null?o.hi:Math.max.apply(null,v);
    if(hi-lo<1)hi=lo+1;
    var X=function(i){return pl+i*(W-pl-pr)/(n-1)},Y=function(x){return H-pb-(x-lo)/(hi-lo)*(H-pb-pt)};
    var s='<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+o.label+'">';
    /* grid */
    [lo,(lo+hi)/2,hi].forEach(function(g){
      s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#1a3344" stroke-width="1"/>';
      s+='<text x="'+(pl-5)+'" y="'+(Y(g)+3)+'" text-anchor="end">'+g.toFixed(o.d||0)+'</text>';
    });
    for(var i=0;i<n;i++)if(times[i].slice(11)==='00:00'){
      s+='<line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#1a3344" stroke-dasharray="3 3"/>';
      s+='<text x="'+(X(i)+3)+'" y="'+(H-5)+'">'+new Date(times[i]).toLocaleDateString('en-GB',{weekday:'short'})+'</text>';
    }
    if(o.bar){
      var bw=(W-pl-pr)/n;
      for(i=0;i<n;i++)s+='<rect x="'+(X(i)-bw/2)+'" y="'+Y(v[i])+'" width="'+Math.max(bw-.8,1)+'" height="'+(Y(lo)-Y(v[i]))+'" rx="1.5" fill="'+o.c+'" opacity=".85"/>';
    }else{
      /* area fill */
      var pts=[];
      for(i=0;i<n;i++)pts.push(X(i).toFixed(1)+','+Y(v[i]).toFixed(1));
      s+='<polygon points="'+X(0)+','+Y(lo)+' '+pts.join(' ')+' '+X(n-1)+','+Y(lo)+'" fill="'+o.c+'" opacity=".12"/>';
      s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+o.c+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    /* current hour marker */
    s+='<line x1="'+X(hour)+'" x2="'+X(hour)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#fff" stroke-width="1.4" opacity=".7"/>';
    s+='<circle cx="'+X(hour)+'" cy="'+Y(v[hour])+'" r="3.5" fill="#fff" stroke="'+o.c+'" stroke-width="2"/>';
    return s+'</svg></div>';
  }

  function renderDetail(){
    var mc=mCache[keyOf(sel)],M=(mc&&mc!=='wait')?mc.hourly:null,
        pd=ptCache[keyOf(sel)],X=(pd&&pd!=='wait')?pd:null,E=X?X.hourly:null,
        n=times.length,S={s:[],t:[],r:[],p:[],d:[]},t,w,uu,vv;
    if(E){
      for(t=0;t<n;t++){S.t.push(E.temperature_2m[t]);S.s.push(E.wind_speed_10m[t]*3.6);S.r.push(Math.max(0,E.precipitation[t]||0));S.p.push(E.pressure_msl[t]);S.d.push(E.wind_direction_10m[t]);}
    }else{
      w=wts(sel.lat,sel.lng);
      for(t=0;t<n;t++){
        uu=val(D.u[t],w);vv=val(D.v[t],w);
        S.s.push(Math.hypot(uu,vv)*3.6);S.d.push((Math.atan2(-uu,-vv)*180/Math.PI+360)%360);
        S.t.push(val(D.t[t],w));S.r.push(Math.max(0,val(D.r[t],w)));S.p.push(val(D.p[t],w));
      }
    }
    var end=Math.min(hour+23,n-1),pk=hour,wet=hour,rs=0,tmin=99,tmax=-99,cp=hour,cmax=0;
    for(t=hour;t<=end;t++){
      if(S.s[t]>S.s[pk])pk=t;if(S.r[t]>S.r[wet])wet=t;rs+=S.r[t];
      tmin=Math.min(tmin,S.t[t]);tmax=Math.max(tmax,S.t[t]);
      if(E&&(E.cape[t]||0)>cmax){cmax=E.cape[t];cp=t;}
    }
    var dp=S.p[end]-S.p[hour],dir=S.d[hour],storm=cmax>=2000?'High':cmax>=1000?'Moderate':'Low',day=Math.min(2,Math.floor(hour/24));
    var feels=E?' · feels '+Tm(E.apparent_temperature[hour]).toFixed(0)+'°':'';
    detail.className='panel detail on';
    detail.innerHTML='<div class="dh"><div><h1>'+esc(place||'Point forecast')+'</h1><p class="coords">'+sel.lat.toFixed(2)+'°N, '+sel.lng.toFixed(2)+'°E · '+dayLabel(hour)+'</p></div><div style="display:flex;gap:5px"><button type="button" id="sh2">Share</button><button type="button" id="x" aria-label="Close">×</button></div></div>'+
      '<div class="tiles">'+tile(Tm(S.t[hour]).toFixed(0)+'°','Temp '+TU()+feels)+tile(Wf(S.s[hour]).toFixed(0)+' '+compass[Math.round(dir/22.5)%16],'Wind '+UW[uw].l)+tile(S.r[hour].toFixed(1),'Rain mm/h')+tile(S.p[hour].toFixed(0),'Pressure hPa')+'</div>'+
      (E?'<div class="tiles">'+tile(Math.round(E.relative_humidity_2m[hour])+'%','Humidity')+tile(Math.round(E.uv_index[hour]||0),'UV · '+uvc(E.uv_index[hour]||0))+tile(Math.round(E.cloud_cover[hour])+'%','Cloud cover')+tile(storm,'Storm potential')+'</div><span class="note" style="margin:0 0 4px">Sunrise '+X.daily.sunrise[day].slice(11,16)+' · Sunset '+X.daily.sunset[day].slice(11,16)+'</span>'
        :'<span class="note">'+(pd==='wait'?'Loading humidity, UV and storm data…':'Showing grid estimate; exact-point data unavailable.')+'</span>')+
      (M?marineTiles(M):'')+
      '<h2>Next 24 hours</h2><ul><li>Temperature between '+Tm(tmin).toFixed(0)+' and '+Tm(tmax).toFixed(0)+' '+TU()+'.</li><li>Wind peaks at '+Wf(S.s[pk]).toFixed(0)+' '+UW[uw].l+' around '+dayLabel(pk)+'.</li><li>'+
      (rs<0.2?'Little or no rain expected.':'About '+rs.toFixed(1)+' mm of rain, heaviest around '+dayLabel(wet)+'.')+'</li><li>Pressure is '+(dp<-1?'falling':dp>1?'rising':'steady')+' ('+(dp>0?'+':'')+dp.toFixed(1)+' hPa).</li>'+
      (E?'<li>Thunderstorm potential: '+storm+(cmax>=1000?', peaking around '+dayLabel(cp):'')+'. Reflects instability, not a lightning forecast.</li>':'')+(M?marineLi(M):'')+'</ul>'+
      '<h2>Temperature ('+TU()+')</h2>'+chart(S.t.map(Tm),{c:'#fb923c',label:'Temperature'})+
      '<h2>Rain (mm/h)</h2>'+chart(S.r,{c:'#60a5fa',bar:true,lo:0,hi:Math.max(2,Math.max.apply(null,S.r)),d:1,label:'Rain'})+
      '<h2>Wind speed ('+UW[uw].l+')</h2>'+chart(S.s.map(Wf),{c:'#3dd9c0',lo:0,label:'Wind'})+
      (M?'<h2>Wave height (m)</h2>'+chart(M.wave_height.map(nz),{c:'#38bdf8',lo:0,hi:Math.max(1,Math.max.apply(null,M.wave_height.map(nz))),d:1,label:'Waves'}):'');
    $('x').onclick=function(){sel=null;detail.className='panel detail';if(marker){marker.remove();marker=null;}saveHash();};
    $('sh2').onclick=function(){shareLink(this);};
  }

  /* Search, location, units, share */
  var qt;
  $('q').addEventListener('input',function(){
    clearTimeout(qt);var v=this.value.trim(),res=$('res');
    if(v.length<2){res.textContent='';return;}
    qt=setTimeout(function(){
      fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(v)+'&count=6&language=en&countryCode=LK')
        .then(function(r){return r.json();}).then(function(j){
          var rs=j.results||[];res.textContent=rs.length?'':'No match in Sri Lanka.';
          rs.forEach(function(r){
            var b=document.createElement('button');b.type='button';
            b.textContent=r.name+(r.admin1?', '+r.admin1:'');
            b.onclick=function(){res.textContent='';var ll=L.latLng(r.latitude,r.longitude);if(selectPoint(ll,r.name))map.flyTo(ll,9);else res.textContent='Outside forecast area.';};
            res.appendChild(b);
          });
        }).catch(function(){res.textContent='Search unavailable.';});
    },300);
  });
  $('loc').onclick=function(){
    var res=$('res');
    if(!navigator.geolocation){res.textContent='Location not supported.';return;}
    navigator.geolocation.getCurrentPosition(
      function(p){var ll=L.latLng(p.coords.latitude,p.coords.longitude);if(selectPoint(ll,'Your location'))map.flyTo(ll,9);else res.textContent='Outside forecast area.';},
      function(){res.textContent='Location permission denied.';}
    );
  };
  function refreshUnits(){legend();if(ready){stats();if(sel)renderDetail();}}
  $('uw').onchange=function(){uw=this.value;refreshUnits();};
  $('ut').onchange=function(){ut=this.value;refreshUnits();};
  function parseHash(){
    var o={};location.hash.slice(1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])o[a[0]]=decodeURIComponent(a[1]||'');});
    if(o.c)o.c=o.c.split(',').map(Number);return o;
  }
  function saveHash(){
    if(!ready)return;var c=map.getCenter(),q=['layer='+layer,'t='+times[hour]];
    if(sel)q.push('p='+sel.lat.toFixed(3)+','+sel.lng.toFixed(3));
    q.push('c='+c.lat.toFixed(2)+','+c.lng.toFixed(2),'z='+map.getZoom());
    try{history.replaceState(null,'','#'+q.join('&'));}catch(e){}
  }
  function shareLink(btn){
    saveHash();var u=location.href,o=btn.textContent;
    function done(){btn.textContent='Copied';setTimeout(function(){btn.textContent=o;},1500);}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,function(){prompt('Copy this link',u);});
    else prompt('Copy this link',u);
  }
  $('share').onclick=function(){shareLink(this);};
  map.on('moveend',saveHash);
})();
</script>
</body>
