<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Weather — Sri Lanka Forecast</title>
<meta name="theme-color" content="#040a10">
<meta name="description" content="Explore Sri Lanka's weather through an interactive map, animated wind, hourly forecast and district rainfall intelligence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  color-scheme:dark;
  --bg:#040a10;
  --panel:rgba(7,16,26,.92);
  --panel-solid:#091420;
  --line:rgba(130,170,195,.1);
  --line-hi:rgba(130,170,195,.2);
  --text:#eef6fb;
  --muted:#7892a6;
  --muted2:#4e6578;
  --teal:#2aefc8;
  --teal-dim:rgba(42,239,200,.11);
  --teal-glow:rgba(42,239,200,.38);
  --blue:#5b9dff;
  --amber:#f5b942;
  --orange:#fb923c;
  --violet:#a78bfa;
  --shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.035);
  --radius:18px;
  --radius-sm:11px;
  --font:"Inter",system-ui,-apple-system,sans-serif;
  --display:"Instrument Sans",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
#map{position:absolute;inset:0;background:#050e16}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.52) saturate(.4) contrast(1.12)}
#field,#wind{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#field{z-index:440;opacity:.74}
#wind{z-index:450}

body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:500;
  background:
    radial-gradient(ellipse 85% 75% at 50% 35%,transparent 35%,rgba(4,10,16,.6) 100%),
    linear-gradient(180deg,rgba(4,10,16,.15) 0%,transparent 12%,transparent 88%,rgba(4,10,16,.25) 100%);
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(36px) saturate(1.3);
  -webkit-backdrop-filter:blur(36px) saturate(1.3);
}
.side{
  position:absolute;z-index:900;top:12px;left:64px;
  width:368px;max-height:calc(100% - 96px);overflow:auto;
  padding:16px 16px 14px;
  scrollbar-width:thin;scrollbar-color:#1e3244 transparent;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.side::-webkit-scrollbar{width:4px}
.side::-webkit-scrollbar-thumb{background:#1e3244;border-radius:4px}

.brand{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(145deg,var(--teal),#18b89a);
  display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(42,239,200,.28),0 8px 24px var(--teal-glow);
  flex-shrink:0;position:relative;
}
.brand-mark::after{
  content:"";position:absolute;inset:-4px;border-radius:14px;
  border:1px solid rgba(42,239,200,.12);pointer-events:none;
}
.brand-mark svg{width:18px;height:18px}
.brand-label{font-size:10px;letter-spacing:.22em;font-weight:700;color:var(--teal);text-transform:uppercase}
.brand-sub{font-size:11px;color:var(--muted2);margin-top:2px}

.live{
  display:inline-flex;align-items:center;gap:6px;
  font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);margin-bottom:8px;
}
.live i{
  width:6px;height:6px;border-radius:50%;background:var(--teal);
  animation:pulse 2s ease infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(42,239,200,.55)}
  70%{box-shadow:0 0 0 9px rgba(42,239,200,0)}
  100%{box-shadow:0 0 0 0 rgba(42,239,200,0)}
}

.side h1{
  font-family:var(--display);font-size:1.58rem;font-weight:700;
  letter-spacing:-.04em;line-height:1.08;margin:0 0 4px;
}
.lead{font-size:.76rem;color:var(--muted);line-height:1.48;margin-bottom:12px}

.srch{display:flex;gap:6px;margin-bottom:2px}
input[type=search]{
  flex:1;min-width:0;background:rgba(4,12,20,.8);color:var(--text);
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:10px 11px;font:inherit;font-size:.82rem;
  transition:border-color .2s,box-shadow .2s;
}
input[type=search]::placeholder{color:var(--muted2)}
input[type=search]:focus{
  outline:none;border-color:rgba(42,239,200,.42);
  box-shadow:0 0 0 3px rgba(42,239,200,.09);
}
button,select{font:inherit;cursor:pointer;transition:all .18s ease}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#loc{
  background:linear-gradient(145deg,var(--teal),#18b89a);
  color:#021210;border:none;border-radius:var(--radius-sm);
  padding:0 12px;font-size:.76rem;font-weight:700;
  box-shadow:0 2px 14px var(--teal-glow);
}
#loc:hover{filter:brightness(1.1)}
#res{font-size:.74rem;color:var(--muted);margin-top:3px;max-height:96px;overflow:auto}
#res button{
  display:block;width:100%;text-align:left;
  background:rgba(10,26,40,.9);color:var(--text);
  border:1px solid transparent;border-radius:8px;
  padding:7px 9px;margin-top:2px;font-size:.78rem;
}
#res button:hover{background:rgba(42,239,200,.07);border-color:rgba(42,239,200,.18)}

/* Metrics */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0 14px}
.stat{
  position:relative;overflow:hidden;
  background:linear-gradient(168deg,rgba(255,255,255,.05),rgba(255,255,255,.008));
  border:1px solid rgba(130,170,195,.08);
  border-radius:13px;padding:10px 10px 9px;
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
.stat:hover{
  border-color:rgba(42,239,200,.2);
  transform:translateY(-1px);
  box-shadow:0 10px 28px rgba(0,0,0,.22);
}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.stat-icon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.stat-icon svg{width:12px;height:12px}
.stat-spark{width:46px;height:16px;opacity:.75}
.stat b{
  display:block;font-size:1.24rem;font-weight:700;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1;
}
.stat span{display:block;margin-top:2px;color:var(--muted);font-size:.64rem;line-height:1.3;font-weight:500}
.stat-bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,currentColor);opacity:.3}

/* Wind rose strip */
.rose-row{
  display:flex;align-items:center;gap:10px;
  margin:0 0 14px;padding:10px 11px;
  background:linear-gradient(168deg,rgba(255,255,255,.04),rgba(255,255,255,.006));
  border:1px solid rgba(130,170,195,.08);
  border-radius:12px;
}
.rose-svg{width:52px;height:52px;flex-shrink:0}
.rose-meta{flex:1;min-width:0}
.rose-meta b{display:block;font-size:.95rem;font-weight:700;letter-spacing:-.02em}
.rose-meta span{display:block;font-size:.66rem;color:var(--muted);margin-top:2px;line-height:1.35}

/* Hourly strip */
.hour-strip{
  display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.hour-strip::-webkit-scrollbar{display:none}
.hour-chip{
  flex:0 0 auto;min-width:44px;text-align:center;
  padding:6px 4px;border-radius:9px;
  background:rgba(8,22,34,.7);border:1px solid transparent;
  cursor:pointer;transition:all .15s;
}
.hour-chip:hover{border-color:rgba(42,239,200,.25)}
.hour-chip.on{background:var(--teal-dim);border-color:rgba(42,239,200,.35)}
.hour-chip .ht{font-size:.58rem;color:var(--muted2);font-weight:500}
.hour-chip .hv{font-size:.78rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.hour-chip .hi{font-size:.55rem;color:var(--muted);margin-top:1px}

.layers{display:flex;flex-wrap:wrap;gap:5px}
.sec-label{
  width:100%;color:var(--muted2);font-size:9px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;margin:0 0 5px;
}
.layers button,.tabs button{
  background:rgba(7,20,32,.95);color:var(--muted);
  border:1px solid var(--line);padding:6px 9px;border-radius:8px;
  font-size:.7rem;font-weight:500;display:inline-flex;align-items:center;gap:4px;
}
.layers button:hover,.tabs button:hover{border-color:rgba(42,239,200,.28);color:#bfd4e4}
.layers button[aria-pressed=true],.tabs button[aria-pressed=true]{
  background:var(--teal-dim);color:var(--teal);
  border-color:rgba(42,239,200,.36);font-weight:600;
  box-shadow:0 0 14px rgba(42,239,200,.07);
}

.units{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;align-items:center}
.units select,.units button{
  background:rgba(7,20,32,.95);color:#c4d8e6;
  border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;font-size:.7rem;font-weight:500;
}
.units select:hover,.units button:hover{border-color:rgba(42,239,200,.26)}
.units button{margin-left:auto}
select option{background:#091420}

.legend{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
#legT{font-size:.72rem;color:#b8cdda;font-weight:500}
.ramp{height:5px;border-radius:20px;margin:7px 0 4px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.lab{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted2)}

.bar{
  position:absolute;z-index:900;left:50%;transform:translateX(-50%);
  bottom:12px;display:flex;gap:10px;align-items:center;
  padding:8px 12px;width:min(680px,calc(100% - 24px));
  border-radius:14px;
}
#play{
  background:linear-gradient(145deg,var(--teal),#18b89a);
  color:#021210;border:none;border-radius:9px;
  padding:8px 14px;font-weight:700;min-width:70px;font-size:.78rem;
  box-shadow:0 2px 14px var(--teal-glow);
}
#play:hover{filter:brightness(1.1)}
input[type=range]{flex:1;accent-color:var(--teal);min-width:55px;cursor:pointer;height:3px}
#when{
  min-width:130px;font-size:.74rem;text-align:right;
  font-variant-numeric:tabular-nums;color:#b8cdda;font-weight:500;
}

.detail{
  position:absolute;z-index:900;top:12px;right:12px;
  width:392px;max-height:calc(100% - 96px);overflow:auto;
  padding:0;display:none;
  scrollbar-width:thin;scrollbar-color:#1e3244 transparent;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.detail.on{display:block;animation:slideIn .22s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.detail::-webkit-scrollbar{width:4px}
.detail::-webkit-scrollbar-thumb{background:#1e3244;border-radius:4px}

.dh{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:16px 16px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(42,239,200,.04),transparent);
}
.dh h1{font-family:var(--display);font-size:1.18rem;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.dh .coords{font-size:.72rem;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dh .coords .dot{width:3px;height:3px;border-radius:50%;background:var(--muted2)}
.dh .btns{display:flex;gap:5px;flex-shrink:0}
.dh button{
  background:rgba(10,26,40,.9);color:var(--muted);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.72rem;font-weight:500;
}
.dh button:hover{border-color:rgba(42,239,200,.3);color:#bfd4e4}
.dh button#x{padding:5px 9px;font-size:.9rem;line-height:1}

.detail-body{padding:12px 16px 16px}

/* Hero current conditions */
.pf-hero{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  margin-bottom:14px;padding:14px;
  background:linear-gradient(145deg,rgba(42,239,200,.07),rgba(91,157,255,.04));
  border:1px solid rgba(42,239,200,.12);
  border-radius:14px;
}
.pf-hero-temp{font-family:var(--display);font-size:2.6rem;font-weight:700;letter-spacing:-.05em;line-height:1}
.pf-hero-feels{font-size:.72rem;color:var(--muted);margin-top:4px}
.pf-hero-meta{text-align:right}
.pf-hero-wind{font-size:1.05rem;font-weight:700;letter-spacing:-.02em}
.pf-hero-dir{font-size:.7rem;color:var(--muted);margin-top:2px}
.pf-hero-rain{font-size:.72rem;color:var(--muted);margin-top:6px}

/* Metric grid with icons */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0 0 12px}
.tile{
  background:linear-gradient(168deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
  border:1px solid rgba(130,170,195,.08);
  border-radius:12px;padding:11px 11px 10px;min-width:0;position:relative;overflow:hidden;
  transition:border-color .15s;
}
.tile:hover{border-color:rgba(42,239,200,.18)}
.tile-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tile-icon{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;
}
.tile-icon svg{width:12px;height:12px}
.tile-label{font-size:.62rem;color:var(--muted);font-weight:500;line-height:1.2}
.tile-val{font-size:1.12rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile-sub{font-size:.62rem;color:var(--muted2);margin-top:2px}
.tile-bar{position:absolute;bottom:0;left:0;height:2px;border-radius:0 1px 0 0;opacity:.55}

/* UV scale bar */
.uv-scale{display:flex;height:4px;border-radius:3px;overflow:hidden;margin-top:5px;gap:1px}
.uv-scale i{flex:1;opacity:.35}
.uv-scale i.on{opacity:1}

/* Sun times */
.sun-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 0 14px;padding:10px 12px;
  background:rgba(8,20,32,.5);border:1px solid rgba(130,170,195,.06);border-radius:11px;
}
.sun-item{display:flex;align-items:center;gap:8px}
.sun-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sun-icon svg{width:14px;height:14px}
.sun-label{font-size:.6rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sun-time{font-size:.88rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Summary list */
.pf-summary{
  margin:0 0 14px;padding:0;list-style:none;
  background:rgba(8,20,32,.4);border:1px solid rgba(130,170,195,.06);border-radius:12px;overflow:hidden;
}
.pf-summary li{
  display:flex;gap:10px;align-items:flex-start;
  padding:9px 12px;font-size:.76rem;line-height:1.45;color:#a8c0d0;
  border-bottom:1px solid rgba(130,170,195,.05);
}
.pf-summary li:last-child{border-bottom:0}
.pf-summary .si{
  width:18px;height:18px;border-radius:5px;flex-shrink:0;margin-top:1px;
  display:grid;place-items:center;
}
.pf-summary .si svg{width:10px;height:10px}

.detail h2{
  font-size:.66rem;margin:14px 0 6px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);
  display:flex;align-items:center;gap:8px;
}
.detail h2::after{content:"";flex:1;height:1px;background:var(--line)}
.detail ul{margin:4px 0;padding-left:14px;font-size:.76rem;line-height:1.52;color:#a2bbcc}
.detail li+li{margin-top:3px}
.note{display:block;color:var(--muted2);font-size:.64rem;line-height:1.35;margin-top:6px}
svg text{fill:var(--muted2);font-size:9px;font-family:var(--font)}
.chart-wrap{
  background:rgba(5,14,22,.55);border-radius:11px;padding:6px 4px 2px;
  border:1px solid rgba(130,170,195,.05);margin-bottom:2px;
}

/* Marine section accent */
.marine-block{
  margin:12px 0;padding:12px;
  background:linear-gradient(145deg,rgba(56,189,248,.06),rgba(56,189,248,.02));
  border:1px solid rgba(56,189,248,.12);border-radius:12px;
}
.marine-block .tiles{margin-bottom:0}
.marine-label{
  font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#38bdf8;margin-bottom:8px;
}

.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  background:var(--panel-solid);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);
}
.leaflet-popup-content{margin:10px 12px;font-family:var(--font);font-size:.8rem;line-height:1.48}
.leaflet-control-zoom{border:1px solid var(--line)!important;border-radius:10px!important;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)!important}
.leaflet-control-zoom a{background:var(--panel-solid)!important;color:var(--text)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(4,10,16,.82)!important;color:var(--muted2)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--teal)!important}

body.dist #detail{display:none!important}
.dm{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-size:.72rem;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.72);
  box-shadow:0 4px 18px rgba(0,0,0,.45);
}
.tabs{display:flex;gap:4px;margin:9px 0 7px;flex-wrap:wrap}
.row{
  display:grid;grid-template-columns:102px 1fr 38px;gap:6px;align-items:center;
  padding:5px 0;cursor:pointer;font-size:.76rem;
  border-bottom:1px solid rgba(130,170,195,.045);
}
.row:hover{background:rgba(42,239,200,.03)}
.row i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,#4d9cff,#8b7bfa)}
.row b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row small{display:block;color:var(--muted2);font-size:.62rem;line-height:1.3}
.row small.hi{color:var(--orange)}

#msg{
  position:absolute;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);
  padding:18px 28px;border-radius:14px;color:var(--text);font-size:.86rem;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
}

/* Drag handle for mobile bottom sheets */
.sheet-handle{
  display:none;width:36px;height:4px;border-radius:2px;
  background:rgba(148,180,200,.25);margin:8px auto 0;
}

@media(max-width:900px){
  .side{left:52px;width:325px;padding:14px}
  .side h1{font-size:1.4rem}
  .detail{width:360px;right:10px}
}

/* ── Tablet / large phone landscape ── */
@media(max-width:700px){
  body{overflow:hidden}
  .leaflet-control-zoom{display:none!important}

  /* Side panel: compact top card */
  .side{
    top:max(6px,env(safe-area-inset-top));
    left:8px;right:8px;width:auto;
    max-height:min(42vh,calc(100% - 100px));
    padding:12px;
    border-radius:16px;
    transition:opacity .2s,transform .2s,max-height .25s;
  }
  body.pf-open .side,
  body.dist .side{
    opacity:0;pointer-events:none;transform:translateY(-8px);
  }
  .side h1{font-size:1.25rem}
  .lead{font-size:.7rem;margin-bottom:10px}
  .brand{margin-bottom:8px}
  .brand-mark{width:30px;height:30px;border-radius:9px}
  .live{margin-bottom:6px}
  .stats{gap:6px;margin:10px 0 10px}
  .stat{padding:9px}
  .stat b{font-size:1.05rem}
  .stat span{font-size:.62rem}
  .stat-spark{width:40px;height:14px}
  .rose-row{padding:8px 10px;margin-bottom:10px;gap:8px}
  .rose-svg{width:42px;height:42px}
  .rose-meta b{font-size:.88rem}
  .rose-meta span{font-size:.62rem}
  .hour-strip{margin-bottom:10px;gap:3px}
  .hour-chip{min-width:40px;padding:5px 3px;border-radius:8px}
  .hour-chip .hv{font-size:.74rem}
  .layers{gap:4px}
  .layers button{padding:7px 9px;font-size:.68rem;min-height:32px}
  .units{margin-top:10px;gap:5px}
  .units select,.units button{padding:8px 9px;font-size:.7rem;min-height:34px}

  .detail{

  }

  .tiles{gap:7px;margin-bottom:12px}

  .tile-label{font-size:.64rem}

  .sun-time{font-size:.9rem}
  .sun-icon{width:30px;height:30px}

  .pf-summary{margin-bottom:12px;border-radius:12px}

  .detail h2{margin:12px 0 6px;font-size:.64rem}

  .bar{

/* ── Small phones ── */

  .stat{padding:8px}
  .stat b{font-size:.98rem}
  .stat-top{margin-bottom:4px}
  .rose-meta span{display:none}
  .layers button{padding:6px 7px;font-size:.64rem}
  .units select,.units button{padding:7px 8px;font-size:.66rem}

  .detail{max-height:min(68vh,calc(100% - 64px))}
  .pf-hero{padding:11px;gap:8px}
  .pf-hero-temp{font-size:2.15rem}

  .tile{padding:10px 9px 9px}
  .tile-val{font-size:1.02rem}

  .dh{padding:2px 12px 10px}
  .bar{padding:7px 9px}
  #play{padding:8px 12px;min-width:58px;min-height:38px}
  #when{min-width:70px;font-size:.66rem}
}

/* ── Very small ── */
@media(max-width:360px){
  .side{padding:8px;left:6px;right:6px}
  .side h1{font-size:1.02rem}
  .stats{gap:4px}
  .stat b{font-size:.9rem}
  .layers button{font-size:.6rem;padding:5px 6px}
  .pf-hero-temp{font-size:1.95rem}
  .tile-val{font-size:.95rem}

/* Landscape phones: keep map usable */
@media(max-height:480px) and (orientation:landscape){
  .side{
    top:6px;left:6px;right:auto;width:min(300px,46vw);

  }

    top:6px;bottom:6px;left:auto;right:6px;

  }
  .sheet-handle{display:none}
  .bar{width:min(420px,55vw);left:50%;transform:translateX(-50%)}
  .lead,.rose-meta span{display:none}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

  /* Wind rose – dominant direction across grid */
  var compass=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  function rose(){
    if(!ready||layer==='dist'||layer==='wave'||layer==='sst'){$('rose').innerHTML='';return;}
    var bins=new Array(16).fill(0),n=D.u[hour].length,su=0,sv=0,cnt=0;
    for(var k=0;k<n;k++){
      var u=D.u[hour][k],v=D.v[hour][k],sp=Math.hypot(u,v);
      if(!(sp>0.05))continue;
      var deg=(Math.atan2(-u,-v)*180/Math.PI+360)%360;
      bins[Math.round(deg/22.5)%16]+=sp;
      su+=u;sv+=v;cnt++;
    }
    var mx=Math.max.apply(null,bins)||1;
    var meanDeg=(Math.atan2(-su,-sv)*180/Math.PI+360)%360;
    var meanSp=cnt?Math.hypot(su,sv)/cnt*3.6:0;
    var label=compass[Math.round(meanDeg/22.5)%16];
    var r=22,cx=26,cy=26,s='';
    for(var i=0;i<16;i++){
      var a=(i*22.5-90)*Math.PI/180,len=5+(bins[i]/mx)*16;
      var x2=cx+Math.cos(a)*len,y2=cy+Math.sin(a)*len;
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+(i===Math.round(meanDeg/22.5)%16?'#2aefc8':'#5b9dff')+'" stroke-width="'+(1.2+bins[i]/mx*1.8)+'" stroke-linecap="round" opacity="'+(0.35+bins[i]/mx*0.55)+'"/>';
    }
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#2aefc8"/>';
    $('rose').innerHTML='<div class="rose-row"><svg class="rose-svg" viewBox="0 0 52 52">'+s+'</svg><div class="rose-meta"><b>'+label+' · '+Wf(meanSp).toFixed(0)+' '+UW[uw].l+'</b><span>Dominant wind across the island grid</span></div></div>';
  }

    var s='<div class="uv-scale">';
    for(var i=0;i<5;i++)s+='<i style="background:'+cols[i]+'" class="'+(u>=levels[i]?'on':'')+'"></i>';
    return s+'</div>';
  }

  function marineTiles(M){
    var w=M.wave_height[hour],p=M.wave_period[hour],sw=M.swell_wave_height[hour],st=M.sea_surface_temperature[hour];
    return '<div class="marine-block"><div class="marine-label">Marine conditions</div><div class="tiles">'+
      metricTile(TI.wave,'Waves',w==null?'–':w.toFixed(1)+' m',p!=null?p.toFixed(0)+' s period':'','#38bdf8',w!=null?Math.min(100,w/4*100):0)+
      metricTile(TI.swell,'Swell',sw==null?'–':sw.toFixed(1)+' m','','#2dd4bf',sw!=null?Math.min(100,sw/3*100):0)+
      metricTile(TI.sst,'Sea temp',st==null?'–':Tm(st).toFixed(0)+'°',TU(),'#fb923c',st!=null?Math.min(100,(st-24)/8*100):0)+
      metricTile(TI.state,'Sea state',w==null?'–':seaState(w),'','#4ade80',w!=null?Math.min(100,w/4*100):0)+
      '</div></div>';
  }
  function marineLi(M){
    var end=Math.min(hour+23,M.wave_height.length-1),pk=hour;
    for(var i=hour;i<=end;i++)if(nz(M.wave_height[i])>nz(M.wave_height[pk]))pk=i;
    return 'Waves peak at '+nz(M.wave_height[pk]).toFixed(1)+' m around '+dayLabel(pk)+' ('+seaState(nz(M.wave_height[pk])).toLowerCase()+'). Check the official marine bulletin before going to sea.';
  }
  function keyOf(ll){return ll.lat.toFixed(2)+','+ll.lng.toFixed(2);}
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
  function uvc(u){return u>=11?'extreme':u>=8?'very high':u>=6?'high':u>=3?'moderate':'low';}

  map.on('click',function(e){if(layer==='dist'||!ready)return;selectPoint(e.latlng,'');});
  function selectPoint(ll,name){
    if(!ready||!wts(ll.lat,ll.lng))return false;
    if(layer==='dist')$('layers').querySelector('button').click();
    sel=ll;place=name||'';
    if(!marker)marker=L.circleMarker(sel,{radius:7,color:'#fff',weight:2.5,fillColor:'#2aefc8',fillOpacity:1}).addTo(map);
    marker.setLatLng(sel);
    var key=keyOf(sel);
    if(!(key in ptCache)){
      ptCache[key]='wait';
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+ll.lat.toFixed(3)+'&longitude='+ll.lng.toFixed(3)+'&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,pressure_msl,wind_speed_10m,wind_direction_10m,uv_index,cloud_cover,cape&daily=sunrise,sunset&wind_speed_unit=ms&forecast_days=3&timezone=Asia%2FColombo')
        .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
        .then(function(d){ptCache[key]=(d.hourly&&d.hourly.time.length===times.length&&d.hourly.time[0]===times[0])?d:null;if(sel&&keyOf(sel)===key)renderDetail();})
        .catch(function(){ptCache[key]=null;if(sel&&keyOf(sel)===key)renderDetail();});
    }
    if(!(key in mCache)){
      mCache[key]='wait';
      fetch('https://marine-api.open-meteo.com/v1/marine?latitude='+ll.lat.toFixed(3)+'&longitude='+ll.lng.toFixed(3)+'&hourly=wave_height,wave_period,swell_wave_height,sea_surface_temperature&forecast_days=3&timezone=Asia%2FColombo')
        .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
        .then(function(d){var h=d.hourly;mCache[key]=(h&&h.wave_height&&h.wave_height.some(function(x){return x!=null;}))?d:null;if(sel&&keyOf(sel)===key)renderDetail();})
        .catch(function(){mCache[key]=null;});
    }
    renderDetail();saveHash();return true;
  }

  function chart(v,o){
    var W=348,H=108,pl=34,pr=10,pt=12,pb=20,n=v.length,
        lo=o.lo!=null?o.lo:Math.min.apply(null,v),hi=o.hi!=null?o.hi:Math.max.apply(null,v);
    if(hi-lo<1)hi=lo+1;
    var X=function(i){return pl+i*(W-pl-pr)/(n-1)},Y=function(x){return H-pb-(x-lo)/(hi-lo)*(H-pb-pt)};
    var gid='cg'+o.c.replace('#','')+(o.bar?'b':'');
    var s='<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+o.label+'">';
    [lo,(lo+hi)/2,hi].forEach(function(g){
      s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#152838" stroke-width="1"/>';
      s+='<text x="'+(pl-5)+'" y="'+(Y(g)+3)+'" text-anchor="end">'+g.toFixed(o.d||0)+'</text>';
    });
    for(var i=0;i<n;i++)if(times[i].slice(11)==='00:00'){
      s+='<line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#152838" stroke-dasharray="3 3"/>';
      s+='<text x="'+(X(i)+3)+'" y="'+(H-5)+'">'+new Date(times[i]).toLocaleDateString('en-GB',{weekday:'short'})+'</text>';
    }
    if(o.bar){
      var bw=(W-pl-pr)/n;
      for(i=0;i<n;i++)s+='<rect x="'+(X(i)-bw/2)+'" y="'+Y(v[i])+'" width="'+Math.max(bw-.8,1)+'" height="'+(Y(lo)-Y(v[i]))+'" rx="1.5" fill="'+o.c+'" opacity=".9"/>';
    }else{
      var pts=[];
      for(i=0;i<n;i++)pts.push(X(i).toFixed(1)+','+Y(v[i]).toFixed(1));
      s+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+o.c+'" stop-opacity=".25"/><stop offset="100%" stop-color="'+o.c+'" stop-opacity="0"/></linearGradient></defs>';
      s+='<polygon points="'+X(0)+','+Y(lo)+' '+pts.join(' ')+' '+X(n-1)+','+Y(lo)+'" fill="url(#'+gid+')"/>';
      s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+o.c+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    s+='<line x1="'+X(hour)+'" x2="'+X(hour)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#fff" stroke-width="1.4" opacity=".55"/>';
    s+='<circle cx="'+X(hour)+'" cy="'+Y(v[hour])+'" r="4" fill="#fff" stroke="'+o.c+'" stroke-width="2.2"/>';
    return s+'</svg></div>';
  }

  function renderDetail(){
    var mc=mCache[keyOf(sel)],M=(mc&&mc!=='wait')?mc.hourly:null,
        pd=ptCache[keyOf(sel)],X=(pd&&pd!=='wait')?pd:null,E=X?X.hourly:null,
        n=times.length,S={s:[],t:[],r:[],p:[],d:[]},t,w,uu,vv;
    if(E){
      for(t=0;t<n;t++){S.t.push(E.temperature_2m[t]);S.s.push(E.wind_speed_10m[t]*3.6);S.r.push(Math.max(0,E.precipitation[t]||0));S.p.push(E.pressure_msl[t]);S.d.push(E.wind_direction_10m[t]);}
    }else{
      w=wts(sel.lat,sel.lng);
      for(t=0;t<n;t++){
        uu=val(D.u[t],w);vv=val(D.v[t],w);
        S.s.push(Math.hypot(uu,vv)*3.6);S.d.push((Math.atan2(-uu,-vv)*180/Math.PI+360)%360);
        S.t.push(val(D.t[t],w));S.r.push(Math.max(0,val(D.r[t],w)));S.p.push(val(D.p[t],w));
      }
    }
    var end=Math.min(hour+23,n-1),pk=hour,wet=hour,rs=0,tmin=99,tmax=-99,cp=hour,cmax=0;
    for(t=hour;t<=end;t++){
      if(S.s[t]>S.s[pk])pk=t;if(S.r[t]>S.r[wet])wet=t;rs+=S.r[t];
      tmin=Math.min(tmin,S.t[t]);tmax=Math.max(tmax,S.t[t]);
      if(E&&(E.cape[t]||0)>cmax){cmax=E.cape[t];cp=t;}
    }
    var dp=S.p[end]-S.p[hour],dir=S.d[hour],storm=cmax>=2000?'High':cmax>=1000?'Moderate':'Low',day=Math.min(2,Math.floor(hour/24));
    var windDir=compass[Math.round(dir/22.5)%16];
    var uvVal=E?Math.round(E.uv_index[hour]||0):0;
    var feelsTxt=E?'Feels like '+Tm(E.apparent_temperature[hour]).toFixed(0)+'°':'';

    var sumIcon=function(bg,col,path){return '<div class="si" style="background:'+bg+';color:'+col+'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">'+path+'</svg></div>';};
    var summaryItems=[
      sumIcon('rgba(251,146,60,.15)','#fb923c','<path d="M8 2v8.5a2.5 2.5 0 11-1.5-2.3"/>')+'Temperature between '+Tm(tmin).toFixed(0)+' and '+Tm(tmax).toFixed(0)+' '+TU(),
      sumIcon('rgba(91,157,255,.15)','#5b9dff','<path d="M2 5h9a2 2 0 100-4H9M2 9h11a2.5 2.5 0 110 5H12"/>')+'Wind peaks at '+Wf(S.s[pk]).toFixed(0)+' '+UW[uw].l+' around '+dayLabel(pk),
      sumIcon('rgba(96,165,250,.15)','#60a5fa','<path d="M4 9a4 4 0 118 0c0 2.5-2 4-4 5.5C6 13 4 11.5 4 9z"/>')+(rs<0.2?'Little or no rain expected':'About '+rs.toFixed(1)+' mm of rain, heaviest around '+dayLabel(wet)),
      sumIcon('rgba(167,139,250,.15)','#a78bfa','<circle cx="8" cy="8" r="5"/><path d="M8 5v3l2 1.2"/>')+'Pressure is '+(dp<-1?'falling':dp>1?'rising':'steady')+' ('+(dp>0?'+':'')+dp.toFixed(1)+' hPa)'
    ];
    if(E)summaryItems.push(sumIcon('rgba(244,114,182,.15)','#f472b6','<path d="M9 2L5 9h3l-1 5 5-8H9z"/>')+'Thunderstorm potential: '+storm+(cmax>=1000?', peaking around '+dayLabel(cp):''));
    if(M)summaryItems.push(sumIcon('rgba(56,189,248,.15)','#38bdf8','<path d="M1 8c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0"/>')+marineLi(M));

    detail.className='panel detail on';
    document.body.classList.add('pf-open');
    detail.innerHTML=
      '<div class="sheet-handle" aria-hidden="true"></div>'+
      '<div class="dh"><div><h1>'+esc(place||'Point forecast')+'</h1>'+
        '<p class="coords"><span>'+sel.lat.toFixed(2)+'°N, '+sel.lng.toFixed(2)+'°E</span><span class="dot"></span><span>'+dayLabel(hour)+'</span></p></div>'+
        '<div class="btns"><button type="button" id="sh2">Share</button><button type="button" id="x" aria-label="Close">×</button></div></div>'+
      '<div class="detail-body">'+
        /* Hero */
        '<div class="pf-hero"><div><div class="pf-hero-temp">'+Tm(S.t[hour]).toFixed(0)+'°</div>'+
          '<div class="pf-hero-feels">'+feelsTxt+(feelsTxt?' · ':'')+TU()+'</div></div>'+
          '<div class="pf-hero-meta"><div class="pf-hero-wind">'+Wf(S.s[hour]).toFixed(0)+' '+UW[uw].l+'</div>'+
          '<div class="pf-hero-dir">'+windDir+' wind</div>'+
          '<div class="pf-hero-rain">'+(S.r[hour]<0.1?'No rain':S.r[hour].toFixed(1)+' mm/h rain')+'</div></div></div>'+
        /* Core metrics */
        '<div class="tiles">'+
          metricTile(TI.temp,'Temperature',Tm(S.t[hour]).toFixed(0)+'°',feelsTxt||TU(),'#fb923c',Math.min(100,(S.t[hour]-20)/20*100))+
          metricTile(TI.wind,'Wind',Wf(S.s[hour]).toFixed(0)+' '+UW[uw].l,windDir,'#5b9dff',Math.min(100,S.s[hour]/50*100))+
          metricTile(TI.rain,'Rain',S.r[hour].toFixed(1)+' mm/h','','#60a5fa',Math.min(100,S.r[hour]/8*100))+
          metricTile(TI.pres,'Pressure',S.p[hour].toFixed(0)+' hPa',(dp<-1?'Falling':dp>1?'Rising':'Steady'),'#a78bfa',Math.min(100,(S.p[hour]-1000)/25*100))+
        '</div>'+
        /* Extended metrics */
        (E?
          '<div class="tiles">'+
            metricTile(TI.hum,'Humidity',Math.round(E.relative_humidity_2m[hour])+'%','','#22d3ee',E.relative_humidity_2m[hour])+
            '<div class="tile"><div class="tile-top">'+TI.uv+'<span class="tile-label">UV index</span></div><div class="tile-val">'+uvVal+'</div><div class="tile-sub">'+uvc(uvVal)+'</div>'+uvBar(uvVal)+'</div>'+
            metricTile(TI.cloud,'Cloud cover',Math.round(E.cloud_cover[hour])+'%','','#94a3b8',E.cloud_cover[hour])+
            metricTile(TI.storm,'Storm risk',storm,cmax>=1000?'CAPE '+Math.round(cmax):'','#f472b6',cmax>=2000?90:cmax>=1000?55:20)+
          '</div>'+
          '<div class="sun-row">'+
            '<div class="sun-item"><div class="sun-icon" style="background:rgba(250,204,21,.12);color:#facc15"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5"/></svg></div><div><div class="sun-label">Sunrise</div><div class="sun-time">'+X.daily.sunrise[day].slice(11,16)+'</div></div></div>'+
            '<div class="sun-item"><div class="sun-icon" style="background:rgba(251,146,60,.12);color:#fb923c"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="9" r="3"/><path d="M8 2v2M2 9h1.5M12.5 9H14M3.5 4.5l1 1M11.5 4.5l-1 1"/></svg></div><div><div class="sun-label">Sunset</div><div class="sun-time">'+X.daily.sunset[day].slice(11,16)+'</div></div></div>'+
          '</div>'
          :'<span class="note" style="margin:0 0 12px;display:block">'+(pd==='wait'?'Loading humidity, UV and storm data…':'Showing grid estimate; exact-point data unavailable.')+'</span>'
        )+
        (M?marineTiles(M):'')+
        /* Summary */
        '<h2>Next 24 hours</h2><ul class="pf-summary">'+summaryItems.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'+
        /* Charts */
        '<h2>Temperature ('+TU()+')</h2>'+chart(S.t.map(Tm),{c:'#fb923c',label:'Temperature'})+
        '<h2>Rain (mm/h)</h2>'+chart(S.r,{c:'#60a5fa',bar:true,lo:0,hi:Math.max(2,Math.max.apply(null,S.r)),d:1,label:'Rain'})+
        '<h2>Wind speed ('+UW[uw].l+')</h2>'+chart(S.s.map(Wf),{c:'#2aefc8',lo:0,label:'Wind'})+
        (M?'<h2>Wave height (m)</h2>'+chart(M.wave_height.map(nz),{c:'#38bdf8',lo:0,hi:Math.max(1,Math.max.apply(null,M.wave_height.map(nz))),d:1,label:'Waves'}):'')+
      '</div>';
    $('x').onclick=function(){
      sel=null;detail.className='panel detail';
      document.body.classList.remove('pf-open');
      if(marker){marker.remove();marker=null;}
      saveHash();
    };
    $('sh2').onclick=function(){shareLink(this);};
  }

  var qt;
  $('q').addEventListener('input',function(){
    clearTimeout(qt);var v=this.value.trim(),res=$('res');
    if(v.length<2){res.textContent='';return;}
    qt=setTimeout(function(){
      fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(v)+'&count=6&language=en&countryCode=LK')
        .then(function(r){return r.json();}).then(function(j){
          var rs=j.results||[];res.textContent=rs.length?'':'No match in Sri Lanka.';
          rs.forEach(function(r){
            var b=document.createElement('button');b.type='button';
            b.textContent=r.name+(r.admin1?', '+r.admin1:'');
            b.onclick=function(){res.textContent='';var ll=L.latLng(r.latitude,r.longitude);if(selectPoint(ll,r.name))map.flyTo(ll,9);else res.textContent='Outside forecast area.';};
            res.appendChild(b);
          });
        }).catch(function(){res.textContent='Search unavailable.';});
    },300);
  });
  $('loc').onclick=function(){
    var res=$('res');
    if(!navigator.geolocation){res.textContent='Location not supported.';return;}
    navigator.geolocation.getCurrentPosition(
      function(p){var ll=L.latLng(p.coords.latitude,p.coords.longitude);if(selectPoint(ll,'Your location'))map.flyTo(ll,9);else res.textContent='Outside forecast area.';},
      function(){res.textContent='Location permission denied.';}
    );
  };
  function refreshUnits(){legend();if(ready){stats();rose();hours();if(sel)renderDetail();}}
  $('uw').onchange=function(){uw=this.value;refreshUnits();};
  $('ut').onchange=function(){ut=this.value;refreshUnits();};
  function parseHash(){
    var o={};location.hash.slice(1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])o[a[0]]=decodeURIComponent(a[1]||'');});
    if(o.c)o.c=o.c.split(',').map(Number);return o;
  }
  function saveHash(){
    if(!ready)return;var c=map.getCenter(),q=['layer='+layer,'t='+times[hour]];
    if(sel)q.push('p='+sel.lat.toFixed(3)+','+sel.lng.toFixed(3));
    q.push('c='+c.lat.toFixed(2)+','+c.lng.toFixed(2),'z='+map.getZoom());
    try{history.replaceState(null,'','#'+q.join('&'));}catch(e){}
  }
  function shareLink(btn){
    saveHash();var u=location.href,o=btn.textContent;
    function done(){btn.textContent='Copied';setTimeout(function(){btn.textContent=o;},1500);}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,function(){prompt('Copy this link',u);});
    else prompt('Copy this link',u);
  }
  $('share').onclick=function(){shareLink(this);};
  map.on('moveend',saveHash);
})();
</script>
</body>
</html>
